trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  acrName: 'moizdevopsacr2026'
  imageName: 'devops-demo-app'
  imageTag: 'v1'

stages:
- stage: Build
  jobs:
  - job: BuildAndTest
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
    - script: pip install pytest pytest-cov
      displayName: 'Install dependencies'
    - script: pytest --cov=app --cov-report=term-missing
      displayName: 'Run tests with coverage'

- stage: DeployDev
  dependsOn: Build
  jobs:
  - job: DeployToDev
    steps:
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'azure-connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az container create \
            --resource-group devops-demo-rg \
            --name devops-demo-dev \
            --image $(acrName).azurecr.io/$(imageName):$(imageTag) \
            --registry-login-server $(acrName).azurecr.io \
            --registry-username $(acrName) \
            --registry-password $(az acr credential show --name $(acrName) --query passwords[0].value -o tsv) \
            --dns-name-label devops-demo-dev-$(Build.BuildId) \
            --ports 80

- stage: DeployProd
  dependsOn: DeployDev
  jobs:
  - job: DeployToProd
    steps:
    - script: echo "Prod deployment coming in the next step (needs an approval gate first)"
      displayName: 'Deploy to Prod (placeholder)'
